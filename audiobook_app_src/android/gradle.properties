# 2G 在本机跑 `flutter build apk --debug` 会直接 OOM（Gradle + AGP + Java 25），
# 实测 4G 稳定：assembleDebug 约 80s、assembleRelease 约 93s
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# Disable Kotlin incremental compilation (broken with Kotlin 2.4 + Java 25 on Windows)
kotlin.incremental=false

# Proxy settings for network access
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=18080
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=18080
#systemProp.http.nonProxyHosts=localhost|127.0.0.1
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
