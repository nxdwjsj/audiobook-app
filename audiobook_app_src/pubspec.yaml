name: audiobook_app
description: 聆云 - 网盘有声书播放器（直接播放网盘音频文件夹，管理目录、进度与收听历史）
publish_to: 'none'
version: 1.1.2+22

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Audio playback
  just_audio: ^0.9.36
  
  # Network
  dio: ^5.4.0
  
  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  
  # File picking (local import)
  file_picker: ^12.3.0
  
  # Image caching
  cached_network_image: ^3.3.0
  
  # State management
  provider: ^6.1.1
  
  # Launch URLs (OAuth authorization)
  url_launcher: ^6.2.5
  html: ^0.15.7

  # 保留但当前无 import：留给后续 SEC-01（app_config 用 HiveAesCipher 加密）。
  # 之所以先不删，是因为加密方案尚未定稿；若最终确定不走 Hive 加密，
  # 可连同本注释一起移除。（原先与它并列的 go_router / intl / crypto
  # 已确认全库 0 引用，本轮删除。）
  encrypt: ^5.0.3

  # 内置网页登录（夸克官方登录页 → 自动读取 Cookie）
  # 必须是 6.2.0-beta 线：稳定版 6.1.5 依赖的 flutter_inappwebview_android 1.1.3
  # 仍用 getDefaultProguardFile('proguard-android.txt')，在 AGP 9 下直接构建失败。
  flutter_inappwebview: 6.2.0-beta.3
  permission_handler: 11.3.1
  # 通知栏 / 锁屏播放控制（MediaSession）
  # 注意：不用 just_audio_background（0.0.1-beta.17 在 Android 16 上
  # MediaSession 状态无法更新，通知栏永远不出现）。直接在
  # AudioPlayerService 里实现 AudioHandler 手动推送状态。
  audio_service: ^0.18.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
